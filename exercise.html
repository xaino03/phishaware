{% extends "base.html" %}{% block title %}Exercise · PhishAware{% endblock %}
{% block content %}<a class="back" href="{{ url_for('index') }}">← All exercises</a><p class="eyebrow">MESSAGE REVIEW</p><h1>{{ scenario.subject }}</h1>
<article class="email"><div class="email-meta"><strong>From</strong><span>{{ scenario.sender }}</span></div><div class="email-meta"><strong>Subject</strong><span>{{ scenario.subject }}</span></div><p class="email-body">{{ scenario.body }}</p></article>
<form class="answer-form" method="post" action="{{ url_for('submit', scenario_id=scenario.id) }}"><label for="participant">Display name <span class="muted">(use a nickname for this demo)</span></label><input id="participant" name="participant" maxlength="40" required autocomplete="off"><fieldset><legend>How would you classify this message?</legend><label class="choice"><input type="radio" name="answer" value="suspicious" required> Suspicious</label><label class="choice"><input type="radio" name="answer" value="legitimate"> Likely legitimate</label></fieldset><button class="button" type="submit">Check my answer</button></form>{% endblock %}
